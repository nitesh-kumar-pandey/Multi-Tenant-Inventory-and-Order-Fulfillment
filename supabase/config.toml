project_id = "stockroom"

[api]
enabled = true
port = 54330
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54331
major_version = 17

[studio]
enabled = true
port = 54332

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[local_smtp]
enabled = false

[analytics]
enabled = false
port = 54337